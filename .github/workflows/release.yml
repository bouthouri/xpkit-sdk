# npm trusted publishing (OIDC): no NPM_TOKEN. npm's trusted-publisher config for each
# package references this exact file name, so do not rename it.
# First release (0.1.0) is published by hand; CI publishes once the trusted publisher is linked.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5 (trusted publishing)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: bun install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          # bun pm pack per package (scripts/check-pack.ts rewrites workspace:* to ^<current version>), then
          # npm publish <tgz> --access public --provenance (OIDC). See scripts/publish-tarballs.ts.
          publish: bun run release
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
